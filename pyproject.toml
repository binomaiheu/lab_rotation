[project]
name = "lab-rotation"
version = "0.1.0"
description = "Lab rotation scheduler using the OR-Tools CP-SAT solver"
readme = "README.md"
authors = [{ name = "Bino Maiheu", email = "binomaiheu@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",
]

[project.scripts]
lab-rotation = "lab_rotation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["lab_rotation.py"]
